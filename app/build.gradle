plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // Logging
    implementation "ch.qos.logback:logback-classic:1.5.19"
    implementation "ch.qos.logback:logback-core:1.5.19"
    implementation "ch.qos.logback.access:logback-access-tomcat:2.0.6"
    implementation "dev.akkinoc.spring.boot:logback-access-spring-boot-starter:4.7.0"
    implementation "net.logstash.logback:logstash-logback-encoder:8.1"


    // OpenAPI / Swagger
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14"

    // Test
    //testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "io.rest-assured:rest-assured:5.5.6"
    testImplementation "io.rest-assured:json-schema-validator:5.5.6"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('bootDev', JavaExec) {
    group = 'application'
    description = 'Runs the Spring Boot application with DEV environment'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = bootRun.mainClass

    environment 'SPRING_PROFILES_ACTIVE', 'dev'
}
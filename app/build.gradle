plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'    //Dependency management in settings.gradle
    id 'idea'                               // Needed for adding source sets so intellij sees them.
    id 'net.miwashi.test-suites'            // Used to add source sets, not using gradle DSL.
}

// Needed for adding source set with test targets (Gradle DSL alternative is messy)
testSuites {

}

// Needed for adding source sets so intellij sees them.
idea {
    module {
        testSources.from(sourceSets.testCommon.java.srcDirs)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring
    implementation "org.springframework.boot:spring-boot-starter-web"           // RESTful webservices
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"     // Dynamic HTML
    implementation "org.springframework.boot:spring-boot-starter-actuator"      // Providing /health and /info endpoints
    developmentOnly "org.springframework.boot:spring-boot-devtools"             // Hot deployment

    // Logging
    implementation libs.logback.classic
    implementation libs.logback.core
    implementation libs.logback.access.tomcat
    implementation libs.logback.access.spring.boot.starter
    implementation libs.logstash.logback.encoder


    // OpenAPI / Swagger - Added for visualisation of API
    implementation libs.springdoc.openapi

    // Test Junit - Jupiter, Rest Assured, and Mockito
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation (libs.rest.assured.core) {
        exclude group: "commons-logging", module: "commons-logging"
    }
    testImplementation libs.rest.assured.json.schema.validator
    testImplementation 'org.mockito:mockito-junit-jupiter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// bootRun target modified to to run server in dev mode
tasks.register('bootRunDev', JavaExec) {
    group = 'application'
    description = 'Runs the Spring Boot application with DEV environment'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = bootRun.mainClass

    environment 'SPRING_PROFILES_ACTIVE', 'dev'
}

// bootRun target modified to to run server in stage mode
tasks.register('bootRunStage', JavaExec) {
    group = 'application'
    description = 'Runs the Spring Boot application with DEV environment'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = bootRun.mainClass

    environment 'SPRING_PROFILES_ACTIVE', 'stage'
}

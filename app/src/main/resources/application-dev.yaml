# Force Spring to load templates from the file system instead of the classpath
# Means changes to templates will be picked up immediately
spring:
  thymeleaf:
    prefix: file:./src/main/resources/templates/
    cache: false

# Activate all actuator endpoints
management:
  info:
    env:
      enabled: true
  endpoints:
    access:
      default: unrestricted
    web:
      exposure:
        include: "*"

info:
  app:
    my-var: ${MY_ENV_VAR:undefined}
    profile: ${spring.profiles.active:default}
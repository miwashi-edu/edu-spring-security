pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }

    plugins {
        id 'org.springframework.boot' version '3.5.6'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'net.miwashi.test-suites' version '1.0.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    versionCatalogs {
        libs {
            version('java', '21')
            version('logback', '1.5.19')
            version('restAssured', '5.5.6')

            library('logback-classic', 'ch.qos.logback', 'logback-classic').versionRef('logback')
            library('logback-core', 'ch.qos.logback', 'logback-core').versionRef('logback')
            library('logback-access-tomcat', 'ch.qos.logback.access:logback-access-tomcat:2.0.6')
            library('logback-access-spring-boot-starter', 'dev.akkinoc.spring.boot:logback-access-spring-boot-starter:4.7.0')
            library('logstash-logback-encoder', 'net.logstash.logback:logstash-logback-encoder:8.1')
            library('springdoc-openapi', 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14')
            library('rest-assured-core', 'io.rest-assured', 'rest-assured').versionRef('restAssured')
            library('rest-assured-json-schema-validator', 'io.rest-assured', 'json-schema-validator').versionRef('restAssured')
        }
    }
}

rootProject.name = 'edu-spring-security'
include('app')
